---
- name: Server health check
  hosts: all
  gather_facts: true
  tasks:
    - name: Disk usage
      shell: "df -h / | awk 'NR==2{print $5}' | tr -d '%'"
      register: disk_usage
      changed_when: false

    - name: Memory usage
      shell: "free | awk '/Mem:/{printf \"%.0f\", $3/$2*100}'"
      register: mem_usage
      changed_when: false

    - name: Service facts
      service_facts:

    - name: Save health json
      copy:
        content: "{{ {'host': inventory_hostname, 'os': ansible_distribution + ' ' + ansible_distribution_version, 'disk_pct': disk_usage.stdout, 'mem_pct': mem_usage.stdout, 'sshd_running': ('sshd' in ansible_facts.services or 'ssh' in ansible_facts.services)} | to_nice_json }}"
        dest: "/reports/data/health_{{ inventory_hostname }}.json"
      delegate_to: localhost
