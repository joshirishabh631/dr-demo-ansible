---
- name: DC to DR failover
  hosts: kvm
  gather_facts: false
  vars:
    dc_vm: "rhel8.10"
    dr_vm: "rhel9.8"
  tasks:
    - name: Record drill start
      set_fact:
        drill_start: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}"

    - name: Check DC VM state
      command: "virsh domstate {{ dc_vm }}"
      register: dc_status
      changed_when: false

    - name: Shut down DC VM (simulate outage)
      command: "virsh shutdown {{ dc_vm }}"
      when: "'running' in dc_status.stdout"

    - name: Wait for DC VM to be shut off
      command: "virsh domstate {{ dc_vm }}"
      register: dc_stop_check
      until: "'shut off' in dc_stop_check.stdout"
      retries: 12
      delay: 5
      changed_when: false

    - name: Start DR VM (failover)
      command: "virsh start {{ dr_vm }}"
      register: dr_start_result
      failed_when: dr_start_result.rc != 0 and 'already active' not in dr_start_result.stderr
      changed_when: dr_start_result.rc == 0

    - name: Confirm DR VM running
      command: "virsh domstate {{ dr_vm }}"
      register: dr_start_check
      until: "'running' in dr_start_check.stdout"
      retries: 12
      delay: 5
      changed_when: false

    - name: Record drill end
      set_fact:
        drill_end: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}"

    - name: Save failover json
      copy:
        content: "{{ {'dc_vm': dc_vm, 'dr_vm': dr_vm, 'drill_start': drill_start, 'drill_end': drill_end} | to_nice_json }}"
        dest: "/reports/data/failover_result.json"
      delegate_to: localhost
